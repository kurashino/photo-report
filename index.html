<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>フォトレポート</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#dde1e9;}
input,textarea,button{font-family:'Noto Sans JP',sans-serif;}

/* TOOLBAR */
.tb{position:sticky;top:0;z-index:200;background:#16213e;display:flex;align-items:center;gap:7px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 2px 16px rgba(0,0,0,.3);}
.tb-title{font-size:14px;font-weight:700;color:#e2c98a;letter-spacing:.05em;margin-right:auto;white-space:nowrap;}
.ms{display:flex;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.16);}
.ms button{padding:5px 11px;font-size:12px;font-weight:600;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-family:inherit;transition:all .14s;white-space:nowrap;}
.ms button.on{background:#d4843a;color:#fff;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .14s;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-ghost{background:transparent;color:#e2c98a;border:1.5px solid rgba(226,201,138,.45);}
.btn-ghost:hover{background:rgba(226,201,138,.1);}
.btn-g{background:#27ae60;color:#fff;}
.btn-r{background:#c0392b;color:#fff;}
.pnav{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:6px;padding:3px 9px;border:1px solid rgba(255,255,255,.14);}
.pnav span{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap;}
.pnav button{background:transparent;border:none;color:#e2c98a;cursor:pointer;font-size:17px;line-height:1;padding:0 1px;font-weight:700;}
.pnav input{width:34px;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#fff;font-size:12px;font-weight:700;padding:2px 3px;font-family:inherit;}
.pnav input:focus{outline:none;}

/* CANVAS */
.wrap{padding:20px 12px;display:flex;justify-content:center;min-height:calc(100vh - 52px);}

/* A4 */
.a4{background:#fff;width:210mm;min-height:297mm;box-shadow:0 6px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:9mm 8mm 7mm;}

/* TITLE */
.ttl-row{margin-bottom:3.5mm;border-bottom:2px solid #16213e;padding-bottom:2.5mm;}
.ttl-main{border:none;outline:none;font-size:19px;font-weight:800;color:#16213e;background:transparent;text-align:center;font-family:inherit;letter-spacing:.03em;width:100%;display:block;}
.ttl-main::placeholder{color:#ccc;}
.ttl-sub{border:none;outline:none;font-size:10px;color:#8a90a0;background:transparent;text-align:center;font-family:inherit;letter-spacing:.05em;width:100%;display:block;margin-top:2px;}
.ttl-sub::placeholder{color:#ddd;}

/* PAGE BAR */
.pgbar{display:flex;justify-content:flex-end;margin-bottom:2.5mm;font-size:7.5px;font-weight:700;color:#8a90a0;letter-spacing:.07em;}

/* PHOTO BODY */
.pbody{flex:1;display:flex;flex-direction:column;}

/* ROW - comment mode: photo | comment */
.prow-c{display:grid;grid-template-columns:52% 1fr;gap:3mm;align-items:stretch;}
.prow-c+.prow-c{margin-top:3mm;}

/* ROW - BA mode */
.prow-ba{display:grid;grid-template-columns:1fr 1fr;gap:3mm;align-items:stretch;}
.prow-ba+.prow-ba{margin-top:3mm;}

/* SLOT */
.slot{position:relative;background:#f2f4f8;border:1.5px dashed #cdd2e0;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .14s;width:100%;aspect-ratio:4/3;}
.slot:hover{border-color:#16213e;}
.slot.full{border-style:solid;border-color:#c5cad8;cursor:default;background:#f2f4f8;aspect-ratio:unset;height:100%;}
.slot.full.is-p{aspect-ratio:unset;}
.slot img{width:100%;height:100%;object-fit:cover;display:block;}
.slot img.portrait{object-fit:contain;}
.slot-ph{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;}
.slot-ph svg{opacity:.28;}
.slot-ph span{font-size:9px;color:#aaa;text-align:center;line-height:1.4;}
.slot-rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(192,57,43,.88);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .14s;}
.slot.full:hover .slot-rm{opacity:1;}
.slot-num{position:absolute;bottom:3px;left:5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}

/* COMMENT PANEL */
.cpanel{background:#f8f9fb;border:1px solid #cdd2e0;border-radius:5px;padding:5px 7px;display:flex;flex-direction:column;height:100%;}
.cpanel textarea{flex:1;width:100%;border:none;outline:none;background:transparent;font-size:10px;line-height:1.75;color:#333;font-family:inherit;resize:none;}
.cpanel textarea::placeholder{color:#ccc;}

/* BA */
.ba-headers{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-bottom:2mm;}
.ba-hdr{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2.5px 0;border-radius:4px;}
.ba-hdr.bef{background:#fff3cd;color:#7d5a00;}
.ba-hdr.aft{background:#d4edda;color:#155724;}
.ba-cell{display:flex;flex-direction:column;height:100%;}
.ba-slot-wrap{flex:1;min-height:0;}
.ba-cap{width:100%;border:1px solid #cdd2e0;border-radius:3px;margin-top:1.5mm;padding:3px 5px;font-size:9px;font-family:inherit;color:#444;background:#f8f9fb;outline:none;resize:none;line-height:1.5;}
.ba-cap::placeholder{color:#ccc;}

/* MISC */
#inp1,#inpM{display:none;}
.drag-ov{display:none;position:fixed;inset:0;z-index:300;background:rgba(22,33,62,.78);color:#e2c98a;font-size:20px;font-weight:800;align-items:center;justify-content:center;}
.drag-ov.on{display:flex;}
.toast{position:fixed;bottom:18px;right:18px;background:#16213e;color:#e2c98a;padding:8px 15px;border-radius:7px;font-size:12px;font-weight:600;opacity:0;transform:translateY(8px);transition:all .2s;z-index:400;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:640px){
  .wrap{padding:8px 2px;}
  .a4{width:100%;min-height:auto;padding:5mm 4mm;}
}
@media print{
  .tb{display:none;}
  .wrap{padding:0;background:white;}
  .a4{box-shadow:none;width:100%;}
  .slot-rm{display:none;}
  .slot{border-style:solid;}
}
</style>
</head>
<body>

<div class="tb">
  <span class="tb-title">📋 フォトレポート</span>
  <div class="ms">
    <button class="on" id="btnC" onclick="setMode('c')">写真＋コメント</button>
    <button id="btnBA" onclick="setMode('ba')">ビフォーアフター</button>
  </div>
  <div class="pnav" id="pnav">
    <button onclick="goPage(curPage-1)">‹</button>
    <span>P</span>
    <input type="number" id="pinput" value="1" min="1" max="25" onchange="goPage(+this.value-1)">
    <span id="ptotal">/ 25</span>
    <button onclick="goPage(curPage+1)">›</button>
  </div>
  <button class="btn btn-ghost" onclick="triggerBulk()">一括選択</button>
  <button class="btn btn-r" onclick="clearAll()">クリア</button>
  <button class="btn btn-g" onclick="exportPDF()">PDF出力</button>
  <button class="btn btn-ghost" onclick="window.print()">印刷</button>
</div>

<div class="drag-ov" id="dov">📷 ドロップして追加</div>

<div class="wrap">
  <div class="a4" id="a4">
    <div class="ttl-row">
      <input class="ttl-main" id="ttlMain" type="text" maxlength="60" placeholder="レポートタイトル" autocomplete="off" spellcheck="false">
      <input class="ttl-sub" id="ttlSub" type="text" maxlength="80" placeholder="サブタイトル・日付・場所など" autocomplete="off" spellcheck="false">
    </div>
    <div class="pgbar" id="pgbar"></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>

<input type="file" id="inp1" accept="image/*">
<input type="file" id="inpM" accept="image/*" multiple>
<div class="toast" id="toast"></div>

<script>
// ===== CONSTANTS =====
const C_PAGES = 25, C_ROWS = 4, BA_PAGES = 25, BA_ROWS = 4;
const MAX_C = C_PAGES * C_ROWS;

// ===== STATE =====
let mode = 'c', curPage = 0;
let cSlots = Array.from({length:MAX_C}, ()=>({photo:null,portrait:false,comment:''}));
let baData = Array.from({length:BA_PAGES}, ()=>
  Array.from({length:BA_ROWS}, ()=>({before:{photo:null,portrait:false},after:{photo:null,portrait:false},capB:'',capA:''}))
);
let pending = null;

// ===== PAGE MAP =====
function buildPageMap() {
  const pages = [];
  let si = 0;
  while (pages.length < C_PAGES && si < MAX_C) {
    const page = [];
    let units = 0;
    while (si < MAX_C && units < 4) {
      const u = cSlots[si].portrait ? 2 : 1;
      if (units + u > 4) break;
      page.push(si); units += u; si++;
    }
    if (page.length === 0) { si++; continue; }
    pages.push(page);
  }
  return pages;
}

// ===== NAVIGATION =====
function goPage(p) {
  p = Math.max(0, Math.min((mode==='c'?C_PAGES:BA_PAGES)-1, p));
  curPage = p;
  document.getElementById('pinput').value = p+1;
  renderPage();
}

// ===== RENDER =====
function renderPage() {
  const pbody = document.getElementById('pbody');
  const pgbar = document.getElementById('pgbar');
  const pnav  = document.getElementById('pnav');
  pbody.innerHTML = '';
  document.getElementById('ptotal').textContent = '/ '+(mode==='c'?C_PAGES:BA_PAGES);
  pgbar.textContent = `PAGE ${curPage+1} / ${mode==='c'?C_PAGES:BA_PAGES}`;
  pnav.style.display = 'flex';
  mode === 'c' ? renderComment(pbody) : renderBA(pbody);
}

function renderComment(container) {
  const pm = buildPageMap();
  const ids = pm[curPage] || [];
  const bodyMM = 253, GAP = 3;
  const units = ids.map(si => cSlots[si].portrait ? 2 : 1);
  const totalU = units.reduce((a,b)=>a+b,0)||4;
  const unitH = (bodyMM - GAP*(ids.length-1)) / totalU;

  ids.forEach((si, idx) => {
    const rH = unitH * units[idx];
    const row = document.createElement('div');
    row.className = idx===0 ? 'prow-c' : 'prow-c';
    if (idx > 0) row.style.marginTop = GAP+'mm';
    row.style.height = rH+'mm';
    row.style.minHeight = '0';

    // Photo
    const slot = mkSlot(cSlots[si].photo, cSlots[si].portrait, si+1,
      ()=>{ pending={type:'c',si}; trig1(); },
      ()=>{ cSlots[si].photo=null; cSlots[si].portrait=false; renderPage(); }
    );
    row.appendChild(slot);

    // Comment
    const cp = document.createElement('div');
    cp.className = 'cpanel';
    const ta = document.createElement('textarea');
    ta.placeholder = 'コメント・所見など...';
    ta.value = cSlots[si].comment;
    ta.dataset.si = si;
    ta.addEventListener('input', e=>{ cSlots[+e.target.dataset.si].comment=e.target.value; });
    cp.appendChild(ta);
    row.appendChild(cp);
    container.appendChild(row);
  });
}

function renderBA(container) {
  const hdrs = document.createElement('div');
  hdrs.className = 'ba-headers';
  hdrs.innerHTML = '<div class="ba-hdr bef">BEFORE　施工前</div><div class="ba-hdr aft">AFTER　施工後</div>';
  container.appendChild(hdrs);

  const bodyMM = 245, GAP = 3;
  const rows = baData[curPage];
  const rowUnits = rows.map(r=>Math.max(r.before.portrait?2:1, r.after.portrait?2:1));
  const totalU = rowUnits.reduce((a,b)=>a+b,0)||BA_ROWS;
  const unitH = (bodyMM - GAP*(rows.length-1)) / totalU;

  rows.forEach((rd, r) => {
    const rH = unitH * rowUnits[r];
    const row = document.createElement('div');
    row.className = 'prow-ba';
    if (r > 0) row.style.marginTop = GAP+'mm';
    row.style.height = rH+'mm';
    row.style.minHeight = '0';

    ['before','after'].forEach(side => {
      const d = rd[side];
      const cell = document.createElement('div');
      cell.className = 'ba-cell';
      const sw = document.createElement('div');
      sw.className = 'ba-slot-wrap';
      const sl = mkSlot(d.photo, d.portrait, side==='before'?`B${r+1}`:`A${r+1}`,
        ()=>{ pending={type:'ba',page:curPage,r,side}; trig1(); },
        ()=>{ baData[curPage][r][side].photo=null; baData[curPage][r][side].portrait=false; renderPage(); }
      );
      sl.style.height = '100%';
      sw.appendChild(sl);
      const cap = document.createElement('textarea');
      cap.className = 'ba-cap'; cap.rows=1;
      cap.placeholder = side==='before'?'施工前コメント':'施工後コメント';
      cap.value = side==='before'?rd.capB:rd.capA;
      cap.dataset.r=r; cap.dataset.side=side;
      cap.addEventListener('input', e=>{
        const rr=+e.target.dataset.r, ss=e.target.dataset.side;
        if(ss==='before') baData[curPage][rr].capB=e.target.value;
        else baData[curPage][rr].capA=e.target.value;
      });
      cell.appendChild(sw); cell.appendChild(cap);
      row.appendChild(cell);
    });
    container.appendChild(row);
  });
}

function mkSlot(photo, portrait, label, onAdd, onRemove) {
  const el = document.createElement('div');
  el.className = 'slot'+(photo?' full'+(portrait?' is-p':''):'');
  if (photo) {
    const img = document.createElement('img');
    img.src=photo; img.alt=label;
    if (portrait) img.className='portrait';
    el.appendChild(img);
    const num=document.createElement('div'); num.className='slot-num'; num.textContent=label; el.appendChild(num);
    const rm=document.createElement('button'); rm.className='slot-rm'; rm.innerHTML='×';
    rm.onclick=e=>{e.stopPropagation();onRemove();}; el.appendChild(rm);
  } else {
    el.innerHTML=`<div class="slot-ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>タップして<br>追加</span></div>`;
    el.onclick=onAdd;
  }
  return el;
}

// ===== FILE INPUT =====
function trig1(){const i=document.getElementById('inp1');i.value='';i.click();}
function triggerBulk(){const i=document.getElementById('inpM');i.value='';i.click();}

document.getElementById('inp1').addEventListener('change',function(){
  const f=this.files[0]; if(!f||!pending) return;
  readImg(f,(url,w,h)=>{
    const port=h>w;
    if(pending.type==='c'){cSlots[pending.si].photo=url;cSlots[pending.si].portrait=port;}
    else{const d=baData[pending.page][pending.r][pending.side];d.photo=url;d.portrait=port;}
    renderPage(); toast('追加しました');
  });
});

document.getElementById('inpM').addEventListener('change',function(){
  const files=Array.from(this.files); if(!files.length) return;
  const empty=cSlots.map((s,i)=>s.photo===null?i:-1).filter(i=>i>=0);
  if(!empty.length){toast('スロットがいっぱいです');return;}
  const take=Math.min(files.length,empty.length);
  let done=0;
  for(let i=0;i<take;i++){
    readImg(files[i],(url,w,h)=>{
      cSlots[empty[i]].photo=url; cSlots[empty[i]].portrait=h>w;
      if(++done===take){
        const pm=buildPageMap();
        const pg=pm.findIndex(p=>p.includes(empty[0]));
        goPage(pg>=0?pg:0); toast(`${take}枚追加`);
      }
    });
  }
});

// ===== DRAG DROP =====
let dc=0;
document.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){dc++;document.getElementById('dov').classList.add('on');}});
document.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;document.getElementById('dov').classList.remove('on');}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();dc=0;document.getElementById('dov').classList.remove('on');
  const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  const empty=cSlots.map((s,i)=>s.photo===null?i:-1).filter(i=>i>=0);
  const take=Math.min(files.length,empty.length);
  if(!take){toast('スロットがいっぱいです');return;}
  let done=0;
  for(let i=0;i<take;i++){
    readImg(files[i],(url,w,h)=>{
      cSlots[empty[i]].photo=url;cSlots[empty[i]].portrait=h>w;
      if(++done===take){const pm=buildPageMap();const pg=pm.findIndex(p=>p.includes(empty[0]));goPage(pg>=0?pg:0);toast(`${take}枚追加`);}
    });
  }
});

// ===== MODE =====
function setMode(m){
  mode=m;
  document.getElementById('btnC').classList.toggle('on',m==='c');
  document.getElementById('btnBA').classList.toggle('on',m==='ba');
  curPage=0; document.getElementById('pinput').value=1;
  renderPage();
}

// ===== CLEAR =====
function clearAll(){
  if(!confirm('全データをクリアしますか？')) return;
  cSlots=Array.from({length:MAX_C},()=>({photo:null,portrait:false,comment:''}));
  baData=Array.from({length:BA_PAGES},()=>Array.from({length:BA_ROWS},()=>({before:{photo:null,portrait:false},after:{photo:null,portrait:false},capB:'',capA:''})));
  document.getElementById('ttlMain').value='';
  document.getElementById('ttlSub').value='';
  curPage=0; document.getElementById('pinput').value=1;
  renderPage(); toast('クリアしました');
}

// ===== HELPERS =====
function readImg(file,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>cb(e.target.result,img.naturalWidth,img.naturalHeight);img.src=e.target.result;};
  r.readAsDataURL(file);
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

// ===== TEXT → IMAGE (日本語対応) =====
async function textToCanvas(text, {fontSize=10, fontWeight='400', color='#333', maxWidthPx=300, lineHeightPx=16} = {}) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const font = `${fontWeight} ${fontSize}px "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif`;
  ctx.font = font;
  
  // 折り返し
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line+ch).width > maxWidthPx && line) {
      lines.push(line); line = ch;
    } else { line += ch; }
  }
  if (line) lines.push(line);
  
  canvas.width  = maxWidthPx;
  canvas.height = lines.length * lineHeightPx + 4;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textBaseline = 'top';
  lines.forEach((l,i) => ctx.fillText(l, 0, i * lineHeightPx + 2));
  return canvas;
}

// ===== PDF EXPORT =====
async function exportPDF() {
  if (!window.jspdf) { toast('ライブラリ読込中...'); return; }
  const { jsPDF } = window.jspdf;

  const titleRaw = document.getElementById('ttlMain').value.trim();
  const sub      = document.getElementById('ttlSub').value.trim();
  const maxP = mode==='c' ? C_PAGES : BA_PAGES;
  const inputPages = prompt(`PDF出力するページ数（1〜${maxP}）`, String(maxP));
  if (inputPages===null) return;
  const exportPages = Math.min(Math.max(1, parseInt(inputPages)||maxP), maxP);

  toast('PDF生成中...');
  await document.fonts.ready;

  const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210, PH=297, MG=10, usW=PW-MG*2;
  // 1mm = 3.7795px @ 96dpi
  const MM2PX = 3.7795;

  async function addTextImg(text, x, y, widthMM, opts={}) {
    if (!text) return 0;
    const widthPx = widthMM * MM2PX * 2; // x2 for retina
    const c = await textToCanvas(text, {
      fontSize: (opts.fontSize||10) * 2,
      fontWeight: opts.fontWeight||'400',
      color: opts.color||'#333',
      maxWidthPx: widthPx,
      lineHeightPx: (opts.lineHeight||14) * 2,
    });
    const hMM = (c.height / c.width) * widthMM;
    pdf.addImage(c.toDataURL('image/png'), 'PNG', x, y, widthMM, hMM);
    return hMM;
  }

  for (let p=0; p<exportPages; p++) {
    if (p>0) pdf.addPage();
    pdf.setFillColor(255,255,255);
    pdf.rect(0,0,PW,PH,'F');

    let ty = MG;

    // タイトル（中央）
    if (titleRaw) {
      const hMM = await addTextImg(titleRaw, MG, ty, usW, {fontSize:18, fontWeight:'800', color:'#16213e', lineHeight:24});
      ty += hMM + 1;
    }

    // サブタイトル（中央）
    if (sub) {
      const hMM = await addTextImg(sub, MG, ty, usW, {fontSize:9, fontWeight:'400', color:'#8a90a0', lineHeight:13});
      ty += hMM + 1;
    }

    // 区切り線
    pdf.setDrawColor(22,33,62); pdf.setLineWidth(0.5);
    pdf.line(MG, ty, PW-MG, ty); ty += 2;

    // PAGE番号
    pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(160,165,180);
    pdf.text(`PAGE ${p+1} / ${exportPages}`, PW-MG, ty+3.5, {align:'right'});
    ty += 5;

    const bodyH = PH - ty - MG;

    if (mode==='c') {
      const pm = buildPageMap();
      const ids = pm[p] || [];
      if (!ids.length) continue;
      const rowUnits = ids.map(si=>cSlots[si].portrait?2:1);
      const totalU = rowUnits.reduce((a,b)=>a+b,0);
      const GAP = 2.5;
      const unitH = (bodyH - GAP*(ids.length-1)) / totalU;
      const photoW = usW*0.52, cX=MG+photoW+3, cW=usW-photoW-3;

      let ry = ty;
      for (let i=0; i<ids.length; i++) {
        const si=ids[i], rH=unitH*rowUnits[i], d=cSlots[si];

        // 写真
        if (d.photo) {
          try { pdf.addImage(d.photo, d.photo.startsWith('data:image/png')?'PNG':'JPEG', MG, ry, photoW, rH); }
          catch(e){ pdf.setFillColor(240,242,245); pdf.rect(MG,ry,photoW,rH,'F'); }
        } else {
          pdf.setFillColor(242,244,248); pdf.rect(MG,ry,photoW,rH,'F');
          pdf.setDrawColor(200,208,220); pdf.setLineWidth(0.25); pdf.rect(MG,ry,photoW,rH,'S');
        }

        // コメント枠
        pdf.setFillColor(248,249,251); pdf.rect(cX,ry,cW,rH,'F');
        pdf.setDrawColor(200,208,220); pdf.setLineWidth(0.25); pdf.rect(cX,ry,cW,rH,'S');

        // コメントテキスト
        if (d.comment) {
          await addTextImg(d.comment, cX+2, ry+2, cW-4, {fontSize:9, fontWeight:'400', color:'#333', lineHeight:13});
        }

        ry += rH + (i<ids.length-1?GAP:0);
      }

    } else {
      // BA
      const colW=(usW-3)/2;
      pdf.setFillColor(255,243,205); pdf.rect(MG,ty-5,colW,6,'F');
      pdf.setFillColor(212,237,218); pdf.rect(MG+colW+3,ty-5,colW,6,'F');
      await addTextImg('BEFORE 施工前', MG+2, ty-4.5, colW-4, {fontSize:8,fontWeight:'700',color:'#7d5a00',lineHeight:11});
      await addTextImg('AFTER 施工後',  MG+colW+5, ty-4.5, colW-4, {fontSize:8,fontWeight:'700',color:'#155724',lineHeight:11});

      const rows=baData[p];
      const rowUnits=rows.map(r=>Math.max(r.before.portrait?2:1,r.after.portrait?2:1));
      const totalU=rowUnits.reduce((a,b)=>a+b,0)||BA_ROWS;
      const GAP=2.5, CAP=5;
      const unitH=(bodyH-GAP*(rows.length-1))/totalU;

      let ry=ty;
      for(let r=0;r<rows.length;r++){
        const rH=unitH*rowUnits[r], imgH=rH-CAP-1, rd=rows[r];
        for(let c=0;c<2;c++){
          const x=MG+c*(colW+3), side=c===0?'before':'after', d=rd[side];
          if(d.photo){
            try{pdf.addImage(d.photo,d.photo.startsWith('data:image/png')?'PNG':'JPEG',x,ry,colW,imgH);}
            catch(e){pdf.setFillColor(240,242,245);pdf.rect(x,ry,colW,imgH,'F');}
          }else{
            pdf.setFillColor(242,244,248);pdf.rect(x,ry,colW,imgH,'F');
            pdf.setDrawColor(200,208,220);pdf.setLineWidth(0.25);pdf.rect(x,ry,colW,imgH,'S');
          }
          const cap=c===0?rd.capB:rd.capA;
          if(cap) await addTextImg(cap, x, ry+imgH+1, colW, {fontSize:7.5,fontWeight:'400',color:'#444',lineHeight:11});
        }
        ry+=rH+(r<rows.length-1?GAP:0);
      }
    }

    // フッター
    const now=new Date();
    pdf.setFont('helvetica','normal');pdf.setFontSize(6.5);pdf.setTextColor(190,193,200);
    pdf.text(`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`,MG,PH-3);
  }

  const fname=(titleRaw||'photo-report').replace(/[\\/:*?"<>|]/g,'_')+'.pdf';
  const pdfBlob=pdf.output('blob');
  const blobUrl=URL.createObjectURL(pdfBlob);

  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS&&navigator.share){
    const file=new File([pdfBlob],fname,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:fname});toast('✅ 共有シートを開きました');return;}
      catch(e){if(e.name==='AbortError') return;}
    }
  }
  const newTab=window.open(blobUrl,'_blank');
  if(!newTab){
    const a=document.createElement('a');a.href=blobUrl;a.download=fname;a.click();
    toast('✅ PDFをダウンロードしました');
  } else {
    toast('✅ プレビューを開きました');
  }
}

// ===== INIT =====
renderPage();
</script>
</body>
</html>
